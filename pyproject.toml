[project]
name = "fraud-radar-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "numpy==2.2.1",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
ml = [
  "pandas==2.2.3",
  "torch==2.6.0",
  "matplotlib==3.10.0",
  "kagglehub==0.3.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests", "ml/tests"]
