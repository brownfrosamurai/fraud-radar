services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=plain://0.0.0.0:9092
      - --advertise-kafka-addr=plain://redpanda:9092
      - --default-log-level=warn
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud_radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_radar"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fraud:fraud@postgres:5432/fraud_radar
      PRODUCER_URL: http://producer:8001
    depends_on:
      postgres:
        condition: service_healthy
      producer:
        condition: service_started

  producer:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["uvicorn", "streaming.producer:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: transactions
    expose:
      - "8001"
    depends_on:
      redpanda:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "streaming.consumer"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP: fraud-radar-scorer
      DATABASE_URL: postgresql+psycopg://fraud:fraud@postgres:5432/fraud_radar
      NOTIFY_URL: http://api:8000/internal/scored
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
